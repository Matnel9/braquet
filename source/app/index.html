<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braquet</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com; font-src 'self'; connect-src 'self'">

<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:block;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:block;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:block;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;font-display:block;src:url(fonts/barlow-condensed-latin-700-italic.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-display:block;src:url(fonts/barlow-condensed-latin-800-italic.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:block;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:block;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:block;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
:root{--bg:#0A0A0B;--s1:#111113;--s2:#141416;--s3:#1B1B1E;--line:#222226;--line2:#34343A;--tx:#F4F1EE;--tx2:#D6D1CC;--mu:#B5B0AA;--acc:#E07C8E;--acc2:#8E2438;--g:#3FB97A;--y:#E8C547;--o:#EE8A3C;--r:#E5484D;--b:#7FA8D6;--nacre:linear-gradient(135deg,#5E3226,#8E2438 45%,#B95468 75%,#E3B3B2)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}a:hover{color:#F2A3B1}
button,select,input{font-family:inherit;font-size:16px}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
header.top{position:sticky;top:0;z-index:50;background:rgba(10,10,11,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:22px;padding-top:12px;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx)}
.logo b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:30px;letter-spacing:3px}
nav.main{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 560px}
nav.main a{color:#C9C4BF;padding:10px 15px;border-radius:999px;text-decoration:none;font-weight:500;font-size:16px;min-height:44px;display:inline-flex;align-items:center}
nav.main a:hover{background:#1B1B1E;color:var(--tx)}
nav.main a.on{background:var(--tx);color:var(--bg);font-weight:600}
.status{display:flex;align-items:center;gap:10px;font-size:15px;color:#C9C4BF}
.dot{width:10px;height:10px;border-radius:50%;background:var(--g);display:inline-block}
.eyebrow{font-size:15px;color:var(--acc);font-weight:600;letter-spacing:1.6px;text-transform:uppercase}
.big{margin:6px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:68px;line-height:.95}
.huge{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:96px;line-height:.92}
.sec{padding:84px 0 0}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:24px}
.muted{color:var(--mu)}
.lead{font-size:21px;color:#C9C4BF;max-width:620px;margin:0}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#C9C4BF;border:1px solid var(--line2);padding:5px 12px;border-radius:999px}
.card{background:var(--s2);border:1px solid var(--line);border-radius:24px;padding:24px}
.grid{display:grid;gap:14px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.tile{background:var(--s2);border:1px solid var(--line);border-radius:22px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:4px}
.tile .lab{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#C9C4BF;gap:6px}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:54px;line-height:1}
.unit{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:23px;color:#C9C4BF;margin-left:5px}
.ib{width:40px;height:40px;margin:-10px -10px -10px 0;border:none;background:transparent;color:#C9C4BF;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;padding:0;flex:0 0 auto}
.ib:hover{background:#26262A;color:var(--tx)}
.ib.inl{margin:0 0 0 4px;width:34px;height:34px;vertical-align:middle}
.toggle{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:5px;flex-wrap:wrap}
.toggle button{border:none;cursor:pointer;padding:11px 20px;min-height:44px;border-radius:999px;font-weight:500;background:transparent;color:#C9C4BF}
.toggle button.on{background:var(--tx);color:var(--bg);font-weight:600}
.btn{border:1px solid var(--line2);background:var(--s3);color:var(--tx);border-radius:999px;padding:12px 20px;min-height:44px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:#26262A}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.panel{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.overlay{position:absolute;background:rgba(10,10,11,.84);border:1px solid #2A2A2E;border-radius:16px;padding:12px 16px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:22px;height:7px;border-radius:4px;display:inline-block}
.readout{display:flex;flex-wrap:wrap;gap:10px}
.readout span{background:var(--s3);border:1px solid var(--line2);border-radius:14px;padding:10px 14px;font-size:16px}
input[type=range]{width:100%;accent-color:#E07C8E;height:44px}
.adv{background:var(--s2);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px}
.adv .ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.adv .kind{font-size:13px;font-weight:600;letter-spacing:1.2px}
.adv h3{margin:0;font-size:24px;font-weight:600;line-height:1.2}
.adv .met{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1}
.adv p{margin:0;font-size:17px;color:var(--tx2)}
.adv .tip{color:var(--tx);font-weight:600}
.adv details{border-top:1px solid var(--line);padding-top:10px;font-size:15px;color:#C9C4BF}
.adv summary{cursor:pointer;color:var(--tx);font-weight:500;min-height:32px;display:flex;align-items:center}
.adv .srcs a{display:block;margin-top:6px;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:16px}
table.t th{text-align:left;color:#C9C4BF;font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line2);font-size:14px}
table.t td{padding:12px;border-bottom:1px solid var(--line)}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#18181B}
.tbl{overflow-x:auto;border-radius:20px;border:1px solid var(--line);background:var(--s2)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:5px 11px;border-radius:999px}
.b-g{background:rgba(63,185,122,.15);color:#5FD497}.b-o{background:rgba(238,138,60,.15);color:#F2A062}.b-b{background:rgba(127,168,214,.15);color:#9DBFE4}.b-n{background:#222226;color:#C9C4BF}.b-a{background:rgba(224,124,142,.16);color:#F0A2B0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.rec{background:var(--s2);border:1px solid var(--line);border-radius:22px;padding:18px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.rec .nm{flex:1 1 200px;display:flex;flex-direction:column;gap:2px}
.zbar{display:flex;height:22px;border-radius:11px;overflow:hidden;background:#1B1B1E}
.zbar div{height:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px;color:#C9C4BF}
.field input,.field select{background:var(--s3);border:1px solid var(--line2);color:var(--tx);border-radius:14px;padding:12px 14px;min-height:48px}
select.sel{background:var(--s3);border:1px solid var(--line2);color:var(--tx);border-radius:999px;padding:10px 16px;min-height:44px;max-width:100%}
.drop{border:2px dashed var(--line2);border-radius:24px;padding:34px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.drop.over{border-color:var(--acc);background:rgba(224,124,142,.06)}
#tipbox{position:fixed;z-index:100;max-width:340px;background:#1F1F23;border:1px solid #3A3A40;border-radius:16px;padding:16px 18px;box-shadow:0 18px 40px rgba(0,0,0,.5);font-size:16px;line-height:1.5;display:none}
#tipbox b{display:block;margin-bottom:4px;font-size:17px}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
.three{width:100%;height:440px;cursor:grab;touch-action:none}
.three:active{cursor:grabbing}
.foot{padding:90px 0 60px;color:#8F8A85;font-size:15px}
.notice{background:#16161A;border:1px solid var(--line2);border-radius:18px;padding:16px 20px;font-size:16px;color:var(--tx2)}
canvas.chart{width:100%!important}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
@media (max-width:760px){.wrap{padding:0 18px}.huge{font-size:62px}.big{font-size:48px}.g-2{grid-template-columns:1fr}.num{font-size:44px}.sec{padding-top:60px}.three{height:340px}}

/* ---- finitions : mouvement et détails ---- */
:root{--ease:cubic-bezier(.22,1,.36,1);--fast:180ms;--normal:350ms;--slow:600ms}
html{-moz-osx-font-smoothing:grayscale}
h1,h2,h3,.big,.huge{text-wrap:balance}
p,.lead,li{text-wrap:pretty}
.num,.unit,.met,table.t td,.readout,.badge{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:14px;height:14px}::-webkit-scrollbar-track{background:#0A0A0B}::-webkit-scrollbar-thumb{background:#2c2c32;border-radius:7px;border:3px solid #0A0A0B}::-webkit-scrollbar-thumb:hover{background:#44444c}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
#app.page-in{animation:pagein var(--normal) var(--ease) both}
@keyframes pagein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.reveal{transform:translateY(24px);transition:opacity var(--slow) var(--ease),transform var(--slow) var(--ease)}
.reveal.now{transition:none}
.grid>.reveal:nth-child(2){transition-delay:.07s}.grid>.reveal:nth-child(3){transition-delay:.14s}.grid>.reveal:nth-child(4){transition-delay:.21s}.grid>.reveal:nth-child(5){transition-delay:.28s}.grid>.reveal:nth-child(6){transition-delay:.35s}
.btn,.toggle button,nav.main a,.ib,select.sel{transition:transform var(--fast) ease-out,background-color var(--fast) ease-out,color var(--fast) ease-out,border-color var(--fast) ease-out}
.btn:active:not(:disabled),.toggle button:active,nav.main a:active{transform:scale(.96)}
.ib:active{transform:scale(.9)}
table.t tr.click td{transition:background-color 150ms ease-out}
.card,.tile,.adv,.rec{box-shadow:0 1px 0 rgba(255,255,255,.035) inset}
.panel{box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 30px 60px -40px rgba(0,0,0,.8)}
[data-open]{transition:background-color var(--fast) ease-out}[data-open]:hover{background:#18181B}
#tipbox{display:block;opacity:0;visibility:hidden;transform:translateY(6px);pointer-events:none;transition:opacity 150ms ease-out,transform 150ms ease-out,visibility 0s linear 150ms}
#tipbox.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity var(--fast) ease-out,transform var(--fast) var(--ease),visibility 0s}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.toast{position:fixed;right:24px;bottom:24px;z-index:200;max-width:440px;background:#1F1F23;border:1px solid #3A3A40;border-radius:16px;padding:16px 20px;font-size:17px;box-shadow:0 18px 40px rgba(0,0,0,.55);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity 150ms ease-out,transform 150ms ease-out}
.toast.on{opacity:1;transform:none;transition:opacity var(--normal) var(--ease),transform var(--normal) var(--ease)}
.demobar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:16px;background:#221a12;border:1px solid #5a4520;color:#F0D9A8;border-radius:999px;padding:8px 10px 8px 22px;font-size:16px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
nav.main a{padding:10px 13px}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.35)}
.leaflet-container{background:#0d0d10;font-family:Inter,sans-serif;border-radius:28px}
.leaflet-control-attribution{background:rgba(10,10,11,.7)!important;color:#8F8A85!important;font-size:12px}.leaflet-control-attribution a{color:#B5B0AA!important}
.leaflet-bar a{background:#1B1B1E!important;color:#F4F1EE!important;border-color:#34343A!important;width:40px!important;height:40px!important;line-height:40px!important;font-size:22px!important}.leaflet-bar a:hover{background:#26262A!important}
.leaflet-bar{border:1px solid #34343A!important;border-radius:12px!important;overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.15s!important;transition-delay:0s!important}.reveal{transform:none}.draw{stroke-dashoffset:0}.btn:active,.toggle button:active,nav.main a:active,.ib:active{transform:none!important}}
.profbtn{padding:6px 14px 6px 6px;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--nacre);display:inline-flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:#F4F1EE;flex:0 0 auto}
.profmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:120;min-width:260px;background:#1B1B1E;border:1px solid #34343A;border-radius:18px;padding:6px;box-shadow:0 22px 50px rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity 150ms ease-out,transform 150ms ease-out,visibility 0s linear 150ms}
.profmenu.on{opacity:1;visibility:visible;transform:none;transition:opacity var(--fast) ease-out,transform var(--fast) var(--ease),visibility 0s}
.profmenu button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px 12px;border-radius:12px;cursor:pointer;font-size:17px;color:#F4F1EE}
.profmenu button:hover,.profmenu button:focus-visible{background:#26262A}
input[type=date]{color-scheme:dark}
.updwall{position:fixed;inset:0;z-index:1000;background:rgba(6,6,7,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;padding:24px;animation:pagein var(--normal) var(--ease) both}
.updbox{max-width:620px;width:100%;background:#141416;border:1px solid #2A2A2E;border-radius:32px;padding:44px;display:flex;flex-direction:column;align-items:flex-start;gap:16px;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.updbar{width:100%;height:10px;border-radius:5px;background:#222226;overflow:hidden;opacity:0;transition:opacity var(--fast) ease-out}
.updbar.on{opacity:1}
.updbar div{height:100%;background:var(--nacre);transform:scaleX(.02);transform-origin:left;transition:transform 200ms ease-out}
</style>
</head>
